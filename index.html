<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Template AcrylicArt</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700;800&family=Bodoni+Moda:ital,wght@1,600;1,700&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="logo-word">Acrylic<span class="accent">art</span></div>
    <div class="topbar-sub">Template de fotos · 1080×1080</div>
  </header>

  <div class="card-wrap" id="wrap">
    <div class="card" id="card">

      <div class="photo-layer" id="photoLayer">
        <img class="img-bg" id="imgBg" alt="">
        <img class="img-main" id="imgMain" alt="">
      </div>

      <div class="top-fade"></div>
      <div class="corner-h"></div>
      <div class="corner-v"></div>
      <div class="frame-border"></div>
      <div class="bottom-scrim" id="scrim"></div>

      <div class="footer-info">
        <div class="measures" id="measuresBlock" hidden>
          <div class="measures-bar"></div>
          <div class="measures-label">Medidas</div>
          <div class="measures-value" id="measuresValue"></div>
        </div>
        <div class="divider"></div>
        <div class="footer-row">
          <div class="wordmark-block" id="wordmarkBlock">
            <div class="wordmark" id="wordmark">Acrylic<span class="accent">Art</span></div>
            <div class="wordmark-sub">Premiações personalizadas</div>
          </div>
          <img class="logo-img" id="logoImg" alt="AcrylicArt" hidden>
          <div class="contact">
            <div class="contact-phone">19 98108-9491</div>
            <div class="contact-handle">@acrylicart.design</div>
          </div>
        </div>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#E6007E" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
        <div class="empty-title">Adicionar imagem</div>
        <div class="empty-sub">clique, arraste um arquivo ou cole (Ctrl+V)</div>
      </div>

      <div class="repos-overlay" id="reposOverlay" hidden>
        <div class="repos-hint" id="reposHint">Arraste para reposicionar · role ou belisque com dois dedos para dar zoom</div>
      </div>

    </div>
  </div>

  <div class="controls">

    <div class="btn-row">
      <button class="btn btn-primary" id="btnPick">Adicionar imagem</button>
      <button class="btn btn-toggle" id="btnRepos">Reposicionar imagem</button>
      <button class="btn btn-outline" id="btnRemove">Remover imagem</button>
    </div>

    <div class="field">
      <label class="field-label">Enquadramento — use “encaixar” para fotos verticais</label>
      <div class="chip-row" id="fitOptions">
        <button class="chip" data-fit="cover">Preencher (corta)</button>
        <button class="chip" data-fit="blur">Encaixar · fundo desfocado</button>
        <button class="chip" data-fit="dark">Encaixar · fundo escuro</button>
      </div>
    </div>

    <div class="zoom-row" id="zoomRow" hidden>
      <span class="zoom-label">Zoom</span>
      <input class="zoom-slider" type="range" min="0.6" max="4" step="0.01" value="1" id="zoomSlider">
      <button class="zoom-reset" id="btnCenter">Centralizar</button>
    </div>

    <div class="field">
      <label class="field-label">Medidas (deixe vazio para ocultar)</label>
      <input class="text-input" type="text" id="inputMedidas" placeholder="ex: 25 × 12 cm">
    </div>

    <div class="field">
      <label class="field-label">Logo no rodapé</label>
      <div class="chip-row" id="logoOptions">
        <button class="chip" data-logo="wordmark">Wordmark</button>
        <button class="chip" data-logo="branco">Logo</button>
      </div>
    </div>

    <div class="field" id="wmField">
      <label class="field-label">Fonte do wordmark</label>
      <div class="chip-row" id="wmOptions">
        <button class="chip wm-chip" data-wm="baloo" style="font-family:'Baloo Thambi 2',sans-serif;font-style:normal">Acrylicart</button>
        <button class="chip wm-chip" data-wm="bodoni" style="font-family:'Bodoni Moda',serif;font-style:italic">Acrylicart</button>
        <button class="chip wm-chip" data-wm="playfair" style="font-family:'Playfair Display',serif;font-style:italic">Acrylicart</button>
        <button class="chip wm-chip" data-wm="cormorant" style="font-family:'Cormorant Garamond',serif;font-style:italic">Acrylicart</button>
        <button class="chip wm-chip" data-wm="times" style="font-family:'Times New Roman',Times,serif;font-style:italic">Acrylicart</button>
      </div>
    </div>

    <button class="download-btn" id="btnDownload">Baixar PNG 1080×1080</button>

    <input type="file" accept="image/*" id="fileInput" class="visually-hidden">
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
